[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-legacy-testkit"
version = "1.0.0"
description = "Tests, profiles, known-answer data and run logging for Nextflow pipelines that have none"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amir Daneshpajouh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nf-legacy-testkit = "nf_legacy_testkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
