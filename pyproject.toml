[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-retrofit"
version = "1.1.0"
description = "Tests, profiles, known-answer data and run logging for Nextflow pipelines that have none"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amir Daneshpajouh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nf-retrofit = "nf_retrofit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
